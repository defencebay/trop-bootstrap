name: Test bootstrap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Cosign for ephemeral test keys
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install lint and pinned Zarf
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            https://github.com/zarf-dev/zarf/releases/download/v0.70.1/zarf_v0.70.1_Linux_amd64 \
            --output "$RUNNER_TEMP/zarf"
          printf '%s  %s\n' \
            a409b568ab8120f5cc3ed0cbbaa819f031750bb320b8b8e26a345c3e2ddaad2a \
            "$RUNNER_TEMP/zarf" | sha256sum --check -
          chmod +x "$RUNNER_TEMP/zarf"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Check syntax and shell lint
        run: |
          bash -n trop-bootstrap.sh
          shellcheck trop-bootstrap.sh
      - name: Test signed release cache and installer gating
        run: python3 scripts/test-bootstrap.py -v
