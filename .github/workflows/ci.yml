name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell scripts
        run: |
          bash -n trop-bootstrap.sh test.sh
          shellcheck trop-bootstrap.sh test.sh
      - name: Run focused tests
        run: ./test.sh
